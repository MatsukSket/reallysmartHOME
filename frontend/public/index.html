<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Умный дом</title>


<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="/style.css?v=catalog-dialogs"></head>
<body>
<div class="bg"></div>

<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></symbol>
<symbol id="i-map" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 12h18M12 3v9"/></symbol>
<symbol id="i-dev" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="14" width="8" height="6" rx="2"/><rect x="14" y="14" width="7" height="6" rx="2"/></symbol>
<symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 12a8 8 0 01-11.5 7.2L4 20l1-4.6A8 8 0 1121 12z"/></symbol>
<symbol id="i-log" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></symbol>
<symbol id="i-ac" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="7" rx="2"/><path d="M7 16c0 2-1 3-1 3M12 16c0 2-1 3-1 3M17 16c0 2-1 3-1 3"/></symbol>
<symbol id="i-boiler" viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="18" rx="3"/><circle cx="12" cy="9" r="2"/><path d="M9 15h6"/></symbol>
<symbol id="i-lamp" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 00-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0012 3z"/></symbol>
<symbol id="i-humid" viewBox="0 0 24 24"><path d="M12 3s6 6.5 6 11a6 6 0 01-12 0c0-4.5 6-11 6-11z"/></symbol>
<symbol id="i-vacuum" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/><path d="M12 3v3"/></symbol>
<symbol id="i-sensor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M6.3 6.3a8 8 0 000 11.4M17.7 6.3a8 8 0 010 11.4M3.5 3.5a12 12 0 000 17M20.5 3.5a12 12 0 010 17"/></symbol>
<symbol id="i-plug" viewBox="0 0 24 24"><path d="M9 3v5M15 3v5M6 8h12v4a6 6 0 01-12 0V8zM12 18v3"/></symbol>
<symbol id="i-cam" viewBox="0 0 24 24"><rect x="3" y="7" width="13" height="10" rx="2"/><path d="M16 11l5-3v8l-5-3"/></symbol>
<symbol id="i-other" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M9 12h6M12 9v6"/></symbol>
<symbol id="i-send" viewBox="0 0 24 24"><path d="M3 11l18-8-8 18-2-7-8-3z"/></symbol>
<symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5a2 2 0 012-2h13v16H6a2 2 0 00-2 2V5zM4 19a2 2 0 012-2h13"/></symbol>
<symbol id="i-fan" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2"/><path d="M12 10c0-4 1-6 3-6s2 3-3 6zM14 12c4 0 6 1 6 3s-3 2-6-3zM12 14c0 4-1 6-3 6s-2-3 3-6zM10 12c-4 0-6-1-6-3s3-2 6 3z"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5l12 7.5-12 7.5z"/></symbol>
<symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
<symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
</defs></svg>

<section id="signin" class="glass p-5">
<h1>Войти в дом</h1>
<form id="login">
<label>Имя <input name="username" required autocomplete="username">
</label>
<label>Пароль <input name="password" type="password" required autocomplete="current-password">
</label>
<button>Войти</button>
</form>
<details>
<summary>Есть приглашение</summary>
<form id="accept">
<input name="code" placeholder="Код приглашения" required>
<input name="password" type="password" placeholder="Новый пароль" required>
<button>Принять</button>
</form>
</details>
</section>
<div id="house" hidden><div class="app">

<!-- 1. ОБЗОР -->
<section id="s-home" class="screen px-5 pt-10">
  <div class="flex items-start justify-between gap-3">
    <div>
      <p id="date" class="mute text-sm font-medium"></p>
      <h1 id="greet" class="text-4xl font-semibold tracking-tight mt-1"></h1>
      <p class="mute text-sm mt-1"><span id="link">Подключение…</span></p>
    </div>
    <button id="prof-btn" data-modal="m-prof" class="glass hov flex items-center gap-2 pl-2 pr-3.5 py-2 shrink-0" style="border-radius:999px" aria-label="Профиль и настройки">
      <span class="ibox" style="width:32px;height:32px;border-radius:50%;background:var(--accsoft);color:var(--acc)"><svg class="ico" style="width:18px;height:18px"><use href="#i-user"/></svg></span>
      <span class="text-left leading-tight"><span class="block text-xs font-semibold">Профиль</span><span id="prof-role" class="block text-[11px] mute">Пользователь</span></span>
    </button>
  </div>

  <div class="glass mt-7 p-5 grid grid-cols-3 gap-3">
    <div>
      <p class="mute text-xs font-medium">Температура</p>
      <p class="num text-4xl mt-1"><span id="temperature">—</span></p>
    </div>
    <div class="pl-3" style="border-left:1px solid var(--line)">
      <p class="mute text-xs font-medium">Влажность</p>
      <p class="num text-4xl mt-1"><span id="humidity">—</span></p>
    </div>
    <div class="pl-3" style="border-left:1px solid var(--line)">
      <p class="mute text-xs font-medium">Работают</p>
      <p class="num text-4xl mt-1"><span id="cnt-on">3</span><span class="mute text-base font-medium"> из <span id="cnt-all">5</span></span></p>
    </div>
  </div>

  <h2 class="text-xl font-semibold tracking-tight mt-8 mb-3">Комнаты</h2>
  <div id="home-rooms" class="grid grid-cols-2 gap-3"></div>
</section>

<!-- 2. УСТРОЙСТВА (план дома) -->
<section id="s-dev" class="screen px-5 pt-10">
  <h1 class="text-4xl font-semibold tracking-tight">Устройства</h1>
  <p class="mute text-sm mt-1">План дома · выберите комнату</p>
  <div class="glass mt-7 p-4"><div id="plan" class="grid grid-cols-2 gap-2"></div></div>
  <button data-modal="m-add" class="admin-only btn btn-acc mt-5 w-full rounded-2xl py-4">Добавить устройство</button>
  <button data-modal="m-room" class="admin-only btn btn-soft mt-5 w-full rounded-2xl py-4 flex items-center justify-center gap-2">
    <svg class="ico"><use href="#i-plus"/></svg>Добавить комнату
  </button>
</section>

<!-- 3. КОМНАТА -->
<section id="s-room" class="screen px-5 pt-10">
  <button id="room-back" class="btn btn-soft rounded-full pl-2 pr-4 py-1.5 text-sm flex items-center gap-1"><svg class="ico" style="width:18px;height:18px"><use href="#i-back"/></svg>План</button>
  <div class="flex items-end justify-between mt-4">
    <div><h1 id="room-title" class="text-4xl font-semibold tracking-tight"></h1><p id="room-sub" class="mute text-sm mt-1"></p></div>
    <button id="room-add" data-modal="m-add" class="admin-only btn btn-acc rounded-2xl px-4 py-2.5 text-sm flex items-center gap-1.5"><svg class="ico" style="width:18px;height:18px"><use href="#i-plus"/></svg>Добавить устройство</button>
  </div>
  <div id="dev-list" class="mt-7 space-y-3"></div>
  <button id="room-remove" class="admin-only btn btn-soft w-full mt-5 rounded-2xl py-3.5">Удалить пустую комнату</button>
</section>

<!-- 4. ПОМОЩНИК RAG -->
<section id="s-chat" class="screen px-5 pt-10">
  <h1 class="text-4xl font-semibold tracking-tight">Помощник</h1>
<small id="provider"></small><div class="mt-7"><p id="question" class="text-right"></p><div id="reply" hidden class="glass p-4"><p id="answer"></p><div id="sources"></div><button id="confirm" hidden>Подтвердить действие</button></div></div>
<form id="chat" class="mt-6 glass p-2 flex items-center gap-2"><input class="flex-1" name="message" aria-label="Сообщение помощнику" autocomplete="off" required><button class="btn btn-acc rounded-xl p-3" aria-label="Отправить"><svg class="ico"><use href="#i-send"/></svg></button></form>
</section>

<!-- 5. СОБЫТИЯ -->
<section id="s-log" class="screen px-5 pt-10">
  <h1 class="text-4xl font-semibold tracking-tight">События</h1>
<div id="audit" class="mt-7 space-y-3"></div></section>

</div>

<!-- TAB BAR -->
<nav class="tabbar">
  <div class="glass max-w-[406px] mx-auto grid grid-cols-4" style="border-radius:26px">
    <button data-tab="s-home" class="tab-btn active flex flex-col items-center gap-1 py-3 text-[11px] font-medium"><svg class="ico"><use href="#i-home"/></svg>Обзор</button>
    <button data-tab="s-dev" class="tab-btn flex flex-col items-center gap-1 py-3 text-[11px] font-medium"><svg class="ico"><use href="#i-map"/></svg>Устройства</button>
    <button data-tab="s-chat" class="tab-btn flex flex-col items-center gap-1 py-3 text-[11px] font-medium"><svg class="ico"><use href="#i-chat"/></svg>Помощник</button>
    <button data-tab="s-log" class="tab-btn flex flex-col items-center gap-1 py-3 text-[11px] font-medium"><svg class="ico"><use href="#i-log"/></svg>События</button>
  </div>
</nav>

<!-- КАРТОЧКА УСТРОЙСТВА -->
<div id="m-dev" class="modal items-end justify-center">
  <div class="sheet w-full max-w-[430px] rounded-t-[28px] p-6">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span id="d-icon" class="ibox"></span>
        <div><p id="d-name" class="text-xl font-semibold tracking-tight leading-tight"></p><p class="text-xs font-semibold"><span id="d-status"></span> <span class="mute font-medium">· <span id="d-room"></span></span></p></div>
      </div>
      <button data-close class="btn btn-soft w-9 h-9 rounded-full flex items-center justify-center" aria-label="Закрыть"><svg class="ico"><use href="#i-x"/></svg></button>
    </div>
    <div id="d-ctl"></div>
    <div id="d-settings"></div>
    <p id="d-warning" class="device-warning" hidden></p>
    <p id="d-feedback" role="status"></p>
    <button id="d-toggle" class="btn w-full mt-6 rounded-2xl py-3.5"></button>
    <button id="d-disconnect" class="admin-only btn btn-soft w-full mt-3 rounded-2xl py-3.5">Отключить от дома</button>
  </div>
</div>

<!-- ДОБАВИТЬ УСТРОЙСТВО -->
<div id="m-add" class="modal catalog-dialog items-end justify-center">
  <div class="sheet w-full max-w-[430px] rounded-t-[28px] p-6">
    <div class="flex items-center justify-between">
      <p class="text-xl font-semibold tracking-tight">Новое устройство</p>
      <button data-close class="btn btn-soft w-9 h-9 rounded-full flex items-center justify-center" aria-label="Закрыть"><svg class="ico"><use href="#i-x"/></svg></button>
    </div>
    <form id="connect-device" class="catalog-form">
      <label>Неподключённые устройства <select id="add-device" name="device_id" class="field" required></select></label>
      <label>Комната <select id="add-room" name="room_id" class="field" required></select></label>
      <button id="add-submit" class="btn btn-acc rounded-2xl py-3.5">Подключить устройство</button>
      <p id="catalog-note" role="status"></p>
    </form>
  </div>
</div>

<!-- ПРОФИЛЬ -->
<div id="m-prof" class="modal items-end justify-center">
  <div class="sheet w-full max-w-[430px] rounded-t-[28px] p-6">
    <div class="flex items-center justify-between">
      <p class="text-xl font-semibold tracking-tight">Профиль</p>
      <button data-close class="btn btn-soft w-9 h-9 rounded-full flex items-center justify-center" aria-label="Закрыть"><svg class="ico"><use href="#i-x"/></svg></button>
    </div>
    <div class="flex items-center gap-3 mt-5">
      <span class="ibox" style="background:var(--accsoft);color:var(--acc)"><svg class="ico"><use href="#i-user"/></svg></span>
      <div><p class="mute text-xs font-semibold">Текущий статус</p><p id="prof-status" class="font-semibold"></p></div>
    </div>

<button id="sessions">Мои сессии</button>
<div id="devices">
</div>
<details class="admin-only"><summary>База знаний</summary>
<form id="manual-upload">
<label>Руководство в формате Markdown <input type="file" name="manual" accept=".md,text/markdown" required></label>
<button>Загрузить и проиндексировать</button>
<p id="manual-feedback" role="status"></p>
</form></details>
<form id="invite" hidden>
<input name="username" placeholder="Имя жильца" required>
<input type="password" name="password" placeholder="Пароль администратора" required>
<button>Создать приглашение</button>
</form>
<p id="code">
</p>
<form id="password">
<label>Текущий пароль <input type="password" name="old_password" required>
</label>
<label>Новый пароль <input type="password" name="new_password" required>
</label>
<button>Сменить пароль</button>
</form>
<button id="logout">Выйти</button>
<details><summary>Автоматизация</summary><form id="target">
<label><span id="target-room">Целевая температура, °C</span> <input name="value" type="number" required value="23">
</label>
<button>Сохранить цель</button>
</form>
<form id="schedule">
<label>Кондиционер <select name="operation">
<option value="turn_on">Включить</option>
<option value="turn_off">Выключить</option>
</select>
</label>
<label>Время UTC <input type="time" name="at" required>
</label>
<button>Добавить расписание</button>
</form>
<div id="rules">
</div>
</details></div></div><!-- ДОБАВИТЬ КОМНАТУ -->
<div id="m-room" class="modal catalog-dialog items-center justify-center px-6">
  <div class="sheet w-full max-w-[380px] rounded-[24px] p-6">
    <div class="flex items-center justify-between">
      <p class="text-xl font-semibold tracking-tight">Новая комната</p>
      <button data-close class="btn btn-soft w-9 h-9 rounded-full flex items-center justify-center" aria-label="Закрыть"><svg class="ico"><use href="#i-x"/></svg></button>
    </div>
    <form id="create-room" class="catalog-form">
      <label>Название <input id="room-name" name="name" maxlength="60" placeholder="Например, Кабинет" class="field" required></label>
      <button class="btn btn-acc rounded-2xl py-3.5">Добавить комнату</button>
    </form>
  </div>
</div>

</div><output id="status" aria-live="polite"></output><script src="/home.js?v=grounded-context"></script></body></html>
